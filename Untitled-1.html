<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
    <title>Clicker Game</title>
</head>
<body>
    <div class="container">
        <h1>Chenisee worker simulator</h1>
        <div class="score-display" id="score">0</div>
        <div class="score-info">Click power: <span id="power">1</span></div>
        <button class="click-btn" id="clickBtn">Click!</button>
        <br>
        <button class="buy-btn" id="buyBtn">Buy +1 Power (<span id="costprice">500</span>)</button>
        <button class="reset-btn" id="resetBtn">Reset</button>
        <p> </p>
        <button class="boba-btn" id="abobabtn"><span id="rebcost">10000</span></button>
    </div>
<script src="script.js"></script>
</body>
</html>
